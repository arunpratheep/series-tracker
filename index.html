/* ═══════════════════════════════════════════════════════════
   ACTIONS ON PROGRESS
   ═══════════════════════════════════════════════════════════ */
let picked = new Set(), selSeason = null;

function checkCompletion(id, before){
  const p = progress(id);
  if(p.status === 'done' && before !== 'done'){
    db.shows[id].completedAt = Date.now();
    save();
    toast('🎉 ' + db.shows[id].name + ' complete!');
    return true;
  }
  if(p.status !== 'done' && db.shows[id].completedAt){
    db.shows[id].completedAt = null; save();
  }
  return false;
}

function markEpisode(showId, epId, on, silent){
  const rec = db.shows[showId];
  if(!rec) return;
  const before = progress(showId).status;
  const w = watchedOf(showId);
  const had = w[epId];
  if(on) w[epId] = Date.now(); else delete w[epId];
  rec.touched = Date.now();
  if(rec.hold && on){ rec.hold = null; }
  save();
  rerender();
  const celebrated = checkCompletion(showId, before);
  if(silent || celebrated) return;
  const ep = (rec.eps||[]).find(e => String(e[E_ID]) === String(epId));
  const code = ep ? epCode(ep[E_S], ep[E_N]) : 'Episode';
  toast(code + (on ? ' marked watched' : ' marked unwatched'), function(){
    if(on){ if(had) w[epId] = had; else delete w[epId]; }
    else { w[epId] = had || Date.now(); }
    save(); rerender();
  });
}

function markMany(showId, epIds, on, label){
  const rec = db.shows[showId];
  const before = progress(showId).status;
  const w = watchedOf(showId);
  const snapshot = Object.assign({}, w);
  epIds.forEach(function(eid){ if(on) w[eid] = Date.now(); else delete w[eid]; });
  rec.touched = Date.now();
  if(rec.hold && on) rec.hold = null;
  save(); rerender();
  const celebrated = checkCompletion(showId, before);
  if(celebrated) return;
  toast(label || (epIds.length + ' episodes updated'), function(){
    db.watched[showId] = snapshot;
    save(); rerender();
  });
}

function stepProgress(id, dir){
  const p = progress(id);
  if(dir > 0 && p.next) markEpisode(id, p.next[E_ID], true);
  else if(dir < 0 && p.last) markEpisode(id, p.last[E_ID], false);
}

/* ═══════════ quick-action sheet (§25) ═══════════ */
function openMenu(id){
  const rec = db.shows[id], p = progress(id);
  const item = (attr, icon, label, cls) =>
    '<button class="sheet-item ' + (cls||'') + '" ' + attr + '>' + ic(icon) + '<span>' + label + '</span></button>';

  let html = '';
  if(p.next) html += item('data-mark="' + id + ':' + p.next[E_ID] + '" data-close="1"', 'check',
    'Mark ' + epCode(p.next[E_S], p.next[E_N]) + ' watched');
  html += item('data-open="' + id + '" data-close="1"', 'grid', 'Open details');
  html += '<div class="sheet-group">Organise</div>';
  html += item('data-fav="' + id + '" data-close="1"', 'star',
    rec.favourite ? 'Remove from favourites' : 'Add to favourites');
  html += item('data-pin="' + id + '" data-close="1"', 'pin',
    rec.pinned ? 'Unpin from top' : 'Pin to top');
  html += item('data-prio="' + id + '"', 'up', 'Priority: ' +
    (['Normal','Medium','High'][rec.priority || 0]));
  html += item('data-note="' + id + '"', 'note', rec.note ? 'Edit note' : 'Add a note');
  html += item('data-platsheet="' + id + '"', 'play', 'Change platform');
  html += '<div class="sheet-group">Status</div>';
  if(rec.hold) html += item('data-resume="' + id + '" data-close="1"', 'play', 'Resume watching');
  else html += item('data-hold="' + id + '"', 'pause', 'Put on hold');
  if(p.status !== 'done') html += item('data-complete="' + id + '" data-close="1"', 'check', 'Mark series completed');
  else html += item('data-rewatch="' + id + '" data-close="1"', 'refresh', 'Watch again');
  html += '<div class="sheet-group">Manage</div>';
  html += item('data-refresh="' + id + '" data-close="1"', 'refresh', 'Refresh from TVmaze');
  html += item('data-del="' + id + '"', 'trash', 'Remove from library', 'danger');
  openSheet(rec.name, html);
}

function openHoldSheet(id){
  const rec = db.shows[id], p = progress(id);
  openSheet('Put on hold',
    '<p class="h-sub" style="margin:0 0 4px">' + esc(rec.name) +
      (p.last ? ' · last watched ' + epCode(p.last[E_S], p.last[E_N]) : '') + '</p>' +
    '<label class="lbl" for="holdWhy">Why? (optional)</label>' +
    '<textarea class="field" id="holdWhy" placeholder="Season got slow, waiting for the next batch…"></textarea>' +
    '<button class="btn primary wide" id="holdGo" style="margin-top:14px">Put on hold</button>',
    function(){
      document.getElementById('holdGo').onclick = function(){
        rec.hold = { since: Date.now(), reason: document.getElementById('holdWhy').value.trim() };
        rec.touched = Date.now(); save(); closeSheet(); rerender();
        toast(rec.name + ' put on hold', function(){ rec.hold = null; save(); rerender(); });
      };
    });
}
function openNoteSheet(id){
  const rec = db.shows[id];
  openSheet('Note', '<label class="lbl" for="noteBox">Private note for ' + esc(rec.name) + '</label>' +
    '<textarea class="field" id="noteBox" placeholder="Watching this with family…">' + esc(rec.note || '') + '</textarea>' +
    '<button class="btn primary wide" id="noteGo" style="margin-top:14px">Save note</button>',
    function(){
      document.getElementById('noteGo').onclick = function(){
        rec.note = document.getElementById('noteBox').value.trim();
        save(); closeSheet(); rerender(); toast('Note saved');
      };
    });
}
function openPlatformSheet(id){
  const rec = db.shows[id];
  openSheet('Where do you watch it?',
    activePlatforms().map(p => '<button class="sheet-item" data-pset="' + id + ':' + esc(p.id) + '">' +
      '<i class="stat-dot" style="background:' + esc(p.color) + ';width:11px;height:11px"></i>' +
      '<span>' + esc(p.name) + '</span>' +
      (rec.platform === p.id ? '<span class="chk">' + ic('check','sm') + '</span>' : '') + '</button>').join('') +
    '<button class="sheet-item" data-pset="' + id + ':"><span style="color:var(--muted)">Not set</span></button>');
}
function openFilterSheet(){
  const genres = {};
  allShows().forEach(s => (s.genres||[]).forEach(g => genres[g] = 1));
  const gl = Object.keys(genres).sort();
  openSheet('Filter &amp; sort',
    '<label class="lbl">Platform</label>' +
    '<select class="field" id="fPlat"><option value="">Any platform</option>' +
      sortedPlatforms().map(p => '<option value="' + esc(p.id) + '"' +
        (libFilter.platform===p.id?' selected':'') + '>' + esc(p.name) + '</option>').join('') + '</select>' +
    '<label class="lbl">Genre</label>' +
    '<select class="field" id="fGenre"><option value="">Any genre</option>' +
      gl.map(g => '<option value="' + esc(g) + '"' + (libFilter.genre===g?' selected':'') + '>' + esc(g) + '</option>').join('') + '</select>' +
    '<label class="lbl">Sort by</label>' +
    '<select class="field" id="fSort">' +
      [['recent','Recently active'],['watched','Recently watched'],['added','Recently added'],
       ['progress','Most complete'],['least','Least complete'],['az','A–Z']]
      .map(o => '<option value="' + o[0] + '"' + (libSort===o[0]?' selected':'') + '>' + o[1] + '</option>').join('') + '</select>' +
    '<button class="sheet-item" id="fFav" style="margin-top:12px">' + ic('star') +
      '<span>Favourites only</span>' + (libFilter.fav ? '<span class="chk">' + ic('check','sm') + '</span>' : '') + '</button>' +
    '<button class="btn primary wide" id="fApply" style="margin-top:16px">Apply</button>' +
    '<button class="btn wide" id="fClear" style="margin-top:9px">Clear all filters</button>',
    function(){
      document.getElementById('fFav').onclick = function(){
        libFilter.fav = !libFilter.fav; closeSheet(); openFilterSheet();
      };
      document.getElementById('fApply').onclick = function(){
        libFilter.platform = document.getElementById('fPlat').value;
        libFilter.genre = document.getElementById('fGenre').value;
        libSort = document.getElementById('fSort').value;
        closeSheet(); viewLibrary();
      };
      document.getElementById('fClear').onclick = function(){
        libFilter = { status:'all', platform:'', genre:'', fav:false };
        findQuery = ''; libSort = db.prefs.sort || 'recent';
        closeSheet(); viewLibrary();
      };
    });
}

/* ═══════════════════════════════════════════════════════════
   ROUTER + NAV
   ═══════════════════════════════════════════════════════════ */
const NAV = [
  { id:'home',     label:'Home',     icon:'home'  },
  { id:'library',  label:'Series',   icon:'grid'  },
  { id:'upnext',   label:'Up next',  icon:'play'  },
  { id:'stats',    label:'Stats',    icon:'stats' },
  { id:'settings', label:'Settings', icon:'gear'  }
];
function paintNav(){
  const nav = document.getElementById('nav');
  const brand = nav.querySelector('.navbrand');
  nav.innerHTML = '';
  if(brand) nav.appendChild(brand);
  NAV.forEach(function(n){
    const b = document.createElement('button');
    b.className = route.name === n.id ? 'on' : '';
    b.dataset.go = n.id;
    b.setAttribute('aria-current', route.name === n.id ? 'page' : 'false');
    b.innerHTML = ic(n.icon) + '<span>' + n.label + '</span>';
    nav.appendChild(b);
  });
}
function go(name, arg){
  route = { name: name, arg: arg };
  if(NAV.some(n => n.id === name)) db.prefs.lastTab = name;
  picked.clear(); selSeason = null;
  paintNav(); rerender();
  if(name !== 'show') window.scrollTo({ top:0 });
}
function rerender(){
  switch(route.name){
    case 'home':     viewHome(); break;
    case 'library':  viewLibrary(); break;
    case 'upnext':   viewUpNext(); break;
    case 'stats':    viewStats(); break;
    case 'settings': viewSettings(); break;
    case 'show':     viewShow(route.arg); break;
    default:         viewHome();
  }
}

/* ═══════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-go],[data-open],[data-fav],[data-pin],[data-prio],[data-mark],' +
    '[data-menu],[data-toggle],[data-fold],[data-sall],[data-supto],[data-ssel],[data-tohere],' +
    '[data-back],[data-step],[data-hold],[data-resume],[data-complete],[data-rewatch],[data-del],' +
    '[data-refresh],[data-note],[data-platsheet],[data-pset],[data-add],[data-fstatus],[data-settheme],' +
    '[data-pmove],[data-ptoggle],[data-pdel],[data-bulk],[data-close]');

  /* episode multi-select swallows row taps first */
  if(selSeason !== null){
    const row = e.target.closest('.ep[data-ep]');
    if(row && Number(row.dataset.eps) === selSeason && (!t || t.dataset.toggle)){
      const id = Number(row.dataset.ep);
      if(picked.has(id)) picked.delete(id); else picked.add(id);
      row.classList.toggle('picked', picked.has(id));
      paintBulkBar();
      return;
    }
  }
  if(!t || t === document.documentElement || t === document.body) return;
  const d = t.dataset;

  if(d.go)    { closeSheet(); return go(d.go); }
  if(d.back)  { return go(db.prefs.lastTab || 'home'); }
  if(d.open)  { closeSheet(); return go('show', d.open); }
  if(d.add)   { return addSeries(d.add); }

  if(d.fav){
    const r = db.shows[d.fav]; r.favourite = !r.favourite; r.touched = Date.now(); save();
    if(d.close) closeSheet();
    rerender(); toast(r.favourite ? 'Added to favourites' : 'Removed from favourites');
    return;
  }
  if(d.pin){
    const r = db.shows[d.pin]; r.pinned = !r.pinned; save();
    if(d.close) closeSheet(); rerender();
    toast(r.pinned ? 'Pinned to top' : 'Unpinned'); return;
  }
  if(d.prio){
    const r = db.shows[d.prio]; r.priority = ((r.priority || 0) + 1) % 3; save();
    openMenu(d.prio); rerender();
    return;
  }
  if(d.note)      { return openNoteSheet(d.note); }
  if(d.platsheet) { return openPlatformSheet(d.platsheet); }
  if(d.pset){
    const parts = d.pset.split(':');
    const r = db.shows[parts[0]];
    if(parts[1]) r.platform = parts[1]; else delete r.platform;
    r.touched = Date.now(); save(); closeSheet(); rerender();
    const p = platformOf(parts[0]);
    toast(p ? 'Now on ' + p.name : 'Platform cleared');
    return;
  }
  if(d.mark){
    const parts = d.mark.split(':');
    if(d.close) closeSheet();
    return markEpisode(parts[0], Number(parts[1]), true);
  }
  if(d.menu)    { return openMenu(d.menu); }
  if(d.hold)    { closeSheet(); return openHoldSheet(d.hold); }
  if(d.resume){
    const r = db.shows[d.resume]; const prev = r.hold;
    r.hold = null; r.touched = Date.now(); save();
    if(d.close) closeSheet();
    rerender();
    toast('Resumed ' + r.name, function(){ r.hold = prev; save(); rerender(); });
    return;
  }
  if(d.complete){
    const p = progress(d.complete);
    const ids = p.eps.filter(e => e[E_S] !== 0 && hasAired(e[E_DATE])).map(e => e[E_ID]);
    if(d.close) closeSheet();
    return markMany(d.complete, ids, true, 'Marked as completed');
  }
  if(d.rewatch){
    const r = db.shows[d.rewatch];
    if(!confirm('Clear all watch progress for "' + r.name + '" and start over?')) return;
    const snap = Object.assign({}, db.watched[d.rewatch] || {});
    db.watched[d.rewatch] = {}; r.completedAt = null; r.touched = Date.now();
    save(); if(d.close) closeSheet(); rerender();
    toast('Starting over', function(){ db.watched[d.rewatch] = snap; save(); rerender(); });
    return;
  }
  if(d.del){
    const r = db.shows[d.del];
    if(!confirm('Remove "' + r.name + '" and its watch history from your library?')) return;
    delete db.shows[d.del]; delete db.watched[d.del];
    save(); closeSheet(); go(db.prefs.lastTab || 'home');
    toast('"' + r.name + '" removed'); return;
  }
  if(d.refresh)  { if(d.close) closeSheet(); return refreshSeries(d.refresh); }

  /* ---- episode level ---- */
  if(d.toggle){
    const id = route.arg, epId = Number(d.toggle);
    return markEpisode(id, epId, !watchedOf(id)[epId]);
  }
  if(d.fold){
    const k = Number(d.fold);
    openSeasons[route.arg] = (openSeasons[route.arg] === k) ? -1 : k;
    return viewShow(route.arg);
  }
  if(d.sall){
    const id = route.arg, k = Number(d.sall), w = watchedOf(id);
    const eps = (db.shows[id].eps||[]).filter(e => e[E_S] === k);
    const on = !eps.every(e => w[e[E_ID]]);
    return markMany(id, eps.map(e => e[E_ID]), on,
      on ? 'Season ' + k + ' marked watched' : 'Season ' + k + ' cleared');
  }
  if(d.supto || d.tohere){
    const id = route.arg, target = Number(d.supto || d.tohere);
    const eps = db.shows[id].eps || [];
    const me = eps.find(e => e[E_ID] === target);
    if(!me) return;
    const ids = eps.filter(function(e){
      if(e[E_S] === 0 && me[E_S] !== 0) return false;
      if(e[E_S] > me[E_S]) return false;
      return e[E_S] < me[E_S] || (e[E_N]||0) <= (me[E_N]||0);
    }).map(e => e[E_ID]);
    return markMany(id, ids, true, 'Marked ' + ids.length + ' episodes watched');
  }
  if(d.ssel){
    const k = Number(d.ssel);
    selSeason = (selSeason === k) ? null : k;
    picked.clear();
    viewShow(route.arg); paintBulkBar();
    return;
  }
  if(d.bulk){
    const id = route.arg;
    if(d.bulk !== 'cancel') markMany(id, [...picked], d.bulk === 'on',
      picked.size + ' episodes updated');
    selSeason = null; picked.clear();
    paintBulkBar(); if(d.bulk === 'cancel') viewShow(id);
    return;
  }
  if(d.step)   { return stepProgress(route.arg, Number(d.step)); }
  if(d.fstatus){ libFilter.status = d.fstatus; return viewLibrary(); }
  if(d.settheme){ db.prefs.theme = d.settheme; save(); applyTheme(); return viewSettings(); }

  /* ---- platform manager ---- */
  if(d.pmove){
    const parts = d.pmove.split(':'), dir = Number(parts[1]);
    const list = sortedPlatforms();
    const i = list.findIndex(p => p.id === parts[0]);
    const j = i + dir;
    if(j < 0 || j >= list.length) return;
    const a = list[i].order; list[i].order = list[j].order; list[j].order = a;
    save(); return viewSettings();
  }
  if(d.ptoggle){
    const p = db.platforms.find(x => x.id === d.ptoggle);
    p.active = p.active === false;
    save(); viewSettings();
    toast(p.name + (p.active ? ' enabled' : ' hidden from the picker'));
    return;
  }
  if(d.pdel) { return deletePlatform(d.pdel); }
  if(d.close){ return closeSheet(); }
});

/* bulk selection bar */
function paintBulkBar(){
  let bar = document.getElementById('bulkbar');
  if(selSeason === null || picked.size === 0){ if(bar) bar.remove(); return; }
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'bulkbar'; bar.className = 'toast on';
    document.body.appendChild(bar);
  }
  bar.innerHTML = '<span>' + picked.size + ' selected</span>' +
    '<button data-bulk="on">Watched</button>' +
    '<button data-bulk="off" style="color:var(--muted)">Clear</button>' +
    '<button data-bulk="cancel" style="color:var(--muted)">Cancel</button>';
}

/* change events: platform dropdown + inline platform edits */
document.addEventListener('change', function(e){
  const el = e.target;
  if(el.dataset.setplat){
    const r = db.shows[el.dataset.setplat];
    if(el.value) r.platform = el.value; else delete r.platform;
    r.touched = Date.now(); save(); rerender();
    const p = platformOf(el.dataset.setplat);
    toast(p ? 'Now on ' + p.name : 'Platform cleared');
  }
  if(el.dataset.pcolor){
    const p = db.platforms.find(x => x.id === el.dataset.pcolor);
    if(p){ p.color = el.value; save(); }
  }
});
document.addEventListener('input', function(e){
  const el = e.target;
  if(el.dataset.pname){
    const p = db.platforms.find(x => x.id === el.dataset.pname);
    if(p){ p.name = el.value; save(); }   /* series link by id, so renames just work */
  }
});

/* top-bar buttons */
document.getElementById('btnAdd').onclick = openAddSheet;
document.getElementById('btnFind').onclick = function(){
  go('library');
  setTimeout(function(){
    const s = document.getElementById('libSearch');
    if(s){ s.focus(); s.scrollIntoView({block:'center'}); }
  }, 80);
};

/* keyboard: / focuses search, a opens add */
document.addEventListener('keydown', function(e){
  if(e.target.matches('input,textarea,select')) return;
  if(e.key === '/'){ e.preventDefault(); document.getElementById('btnFind').click(); }
  if(e.key === 'a'){ e.preventDefault(); openAddSheet(); }
});

/* ═══════════ start ═══════════ */
applyTheme();
libSort = db.prefs.sort || 'recent';
go(db.prefs.lastTab || 'home');
</script>
