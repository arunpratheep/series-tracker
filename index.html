/* ---------- LIBRARY ---------- */
function viewLibrary(){
  let list = allShows().map(s => progress(s.id)).filter(Boolean);
  const counts = {
    all: list.length,
    watching: list.filter(p=>p.status==='watching').length,
    new: list.filter(p=>p.status==='new').length,
    hold: list.filter(p=>p.status==='hold').length,
    done: list.filter(p=>p.status==='done').length
  };
  if(libFilter.status !== 'all') list = list.filter(p => p.status === libFilter.status);
  if(libFilter.platform) list = list.filter(p => p.rec.platform === libFilter.platform);
  if(libFilter.genre) list = list.filter(p => (p.rec.genres||[]).indexOf(libFilter.genre) > -1);
  if(libFilter.fav) list = list.filter(p => p.rec.favourite);
  if(findQuery){
    const q = findQuery.toLowerCase();
    list = list.filter(function(p){
      const plat = platformOf(p.rec.id);
      return p.rec.name.toLowerCase().indexOf(q) > -1 ||
        (plat && plat.name.toLowerCase().indexOf(q) > -1) ||
        (p.rec.genres||[]).some(g => g.toLowerCase().indexOf(q) > -1) ||
        STATUS[p.status].label.toLowerCase().indexOf(q) > -1;
    });
  }
  list.sort(function(a,b){
    switch(libSort){
      case 'az':       return a.rec.name.localeCompare(b.rec.name);
      case 'progress': return b.pct - a.pct;
      case 'least':    return a.pct - b.pct;
      case 'watched':  return (b.lastTs||0) - (a.lastTs||0);
      case 'added':    return (b.rec.addedAt||0) - (a.rec.addedAt||0);
      default:         return (b.lastTs || b.rec.touched || 0) - (a.lastTs || a.rec.touched || 0);
    }
  });

  const chip = (k,label) => '<button class="chip' + (libFilter.status===k?' on':'') + '" data-fstatus="' + k + '">' +
    label + '<span class="n">' + counts[k] + '</span></button>';

  const activeExtra = (libFilter.platform?1:0) + (libFilter.genre?1:0) + (libFilter.fav?1:0);

  let html = '<div class="view">' +
    '<div style="display:flex;align-items:flex-end;gap:12px;margin-bottom:16px">' +
      '<div style="flex:1"><p class="h-eyebrow">My series</p><h1 class="h-title">Library.</h1></div>' +
      '<button class="btn' + (activeExtra?' primary':'') + '" id="btnFilters">' + ic('filter','sm') +
        (activeExtra ? activeExtra : 'Filter') + '</button>' +
    '</div>' +
    '<input class="field" id="libSearch" placeholder="Search my series, platform, genre…" ' +
      'value="' + esc(findQuery) + '" autocomplete="off" style="margin-bottom:14px">' +
    '<div class="chiprow">' + chip('all','All') + chip('watching','Watching') +
      chip('new','Not started') + chip('hold','On hold') + chip('done','Completed') + '</div>';

  html += list.length
    ? '<div class="cardgrid">' + list.map(p => seriesCard(p)).join('') + '</div>'
    : emptyState('🔍', 'Nothing matches',
        findQuery || activeExtra ? 'Try clearing a filter or searching for something else.'
                                 : 'Add a series to start building your library.');
  html += '</div>';
  mainEl.innerHTML = html;

  const si = document.getElementById('libSearch');
  si.addEventListener('input', debounce(function(){
    findQuery = si.value.trim();
    const pos = si.selectionStart;
    viewLibrary();
    const ns = document.getElementById('libSearch');
    ns.focus(); ns.setSelectionRange(pos,pos);
  }, 200));
  document.getElementById('btnFilters').onclick = openFilterSheet;
}

function debounce(fn, ms){
  let t; return function(){ const a = arguments, c = this;
    clearTimeout(t); t = setTimeout(() => fn.apply(c,a), ms); };
}


/* ---------- SERIES DETAIL ---------- */
let openSeasons = {};

function viewShow(id){
  const rec = db.shows[id];
  if(!rec){ go('home'); return; }
  const p = progress(id), plat = platformOf(id), w = watchedOf(id);

  const seasons = {};
  (rec.eps||[]).forEach(function(e){
    (seasons[e[E_S]] = seasons[e[E_S]] || []).push(e);
  });
  const keys = Object.keys(seasons).map(Number).sort((a,b)=>a-b);
  keys.forEach(k => seasons[k].sort((a,b)=>a[E_N]-b[E_N]));
  const realSeasons = keys.filter(k => k !== 0).length;

  if(openSeasons[id] === undefined && p.next) openSeasons[id] = p.next[E_S];

  let html = '<div class="view" style="padding-top:0">' +
    '<div style="display:flex;gap:6px;padding:10px 0 2px">' +
      '<button class="btn sm" data-back="1">' + ic('back','sm') + 'Back</button>' +
      '<span style="flex:1"></span>' +
      '<button class="btn sm icon" data-refresh="' + id + '" aria-label="Refresh from TVmaze">' + ic('refresh','sm') + '</button>' +
      '<button class="btn sm icon" data-menu="' + id + '" aria-label="More actions">' + ic('more','sm') + '</button>' +
    '</div>';

  /* hero */
  html += '<div class="hero">' +
    (rec.poster ? '<div class="hero-bg"><img src="' + esc(rec.poster) + '" alt=""></div>' : '') +
    '<div class="hero-in">' + poster(rec.poster || rec.image, rec.name, 'hero-poster') +
      '<div class="hero-info">' +
        '<h1 class="hero-title">' + esc(rec.name) + '</h1>' +
        '<div class="tagrow">' + statusPill(p.status) +
          (rec.rating ? '<span class="pill">★ ' + rec.rating + '</span>' : '') +
          (rec.premiered ? '<span class="pill">' + rec.premiered.slice(0,4) +
            (rec.ended ? '–' + rec.ended.slice(0,4) : '–') + '</span>' : '') +
          (rec.tvStatus ? '<span class="pill">' + esc(rec.tvStatus) + '</span>' : '') +
        '</div>' +
        '<div class="tagrow">' + ottBadge(plat) +
          (rec.favourite ? '<span class="pill" style="color:var(--accent)">★ Favourite</span>' : '') +
          (rec.pinned ? '<span class="pill">' + ic('pin','sm') + 'Pinned</span>' : '') + '</div>' +
        '<div class="sc-foot" style="margin-top:6px">' +
          '<div class="pbar' + (p.status==='done'?' done':'') + '"><i style="width:' + p.pct + '%"></i></div>' +
          '<span class="pct">' + p.pct + '%</span></div>' +
        '<div class="mono">' + p.done + ' / ' + p.total + ' episodes watched · ' + fmtRun(p.mins) + '</div>' +
      '</div></div></div>';

  /* hold banner */
  if(rec.hold){
    html += '<div style="background:color-mix(in srgb,var(--hold) 14%,transparent);border:1px solid ' +
      'color-mix(in srgb,var(--hold) 40%,var(--line));border-radius:14px;padding:13px;margin-bottom:14px">' +
      '<div style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px">' +
        ic('pause','sm') + 'On hold since ' + esc(fmtDate(rec.hold.since)) + '</div>' +
      (rec.hold.reason ? '<div style="font-size:13.5px;color:var(--muted);margin-top:6px">' +
        esc(rec.hold.reason) + '</div>' : '') +
      '<button class="btn sm primary" data-resume="' + id + '" style="margin-top:11px">Resume watching</button>' +
    '</div>';
  }

  /* the stepper — the fastest way to move progress */
  if(p.next && !rec.hold){
    html += '<div class="stepper" style="margin-bottom:14px">' +
      '<button data-step="-1" aria-label="Un-watch the last episode"' + (p.last ? '' : ' disabled') + '>−</button>' +
      '<div class="mid"><b>' + epCode(p.next[E_S], p.next[E_N]) + ' next</b>' +
        '<span>' + esc(p.next[E_NAME] || 'Untitled') + '</span></div>' +
      '<button data-step="1" aria-label="Mark the next episode watched">+</button>' +
    '</div>' +
    '<button class="btn primary wide" data-mark="' + id + ':' + p.next[E_ID] + '" style="margin-bottom:16px">' +
      ic('check','sm') + 'Mark ' + epCode(p.next[E_S], p.next[E_N]) + ' watched</button>';
  } else if(p.status === 'done'){
    html += '<div style="background:color-mix(in srgb,var(--done) 13%,transparent);border:1px solid ' +
      'color-mix(in srgb,var(--done) 38%,var(--line));border-radius:14px;padding:15px;margin-bottom:14px;text-align:center">' +
      '<div style="font-weight:600">🎉 Series complete</div>' +
      (rec.completedAt ? '<div class="mono" style="margin-top:5px">Finished ' + esc(fmtDate(rec.completedAt)) + '</div>' : '') +
      '<button class="btn sm wide" data-rewatch="' + id + '" style="margin-top:12px">Watch again</button></div>';
  }

  /* facts */
  html += '<dl class="kv">' +
    kv('Seasons', realSeasons) + kv('Episodes', p.total) +
    kv('Watched', p.done) + kv('Remaining', Math.max(0, p.aired - p.doneAired)) +
    kv('Network', rec.network || '—') + kv('Platform', plat ? plat.name : 'Not set') +
    kv('Last watched', p.last ? epCode(p.last[E_S], p.last[E_N]) : '—') +
    kv('Added', ago(rec.addedAt) || '—') +
  '</dl>';

  if(rec.genres && rec.genres.length){
    html += '<div class="tagrow" style="margin-top:14px">' +
      rec.genres.map(g => '<span class="pill">' + esc(g) + '</span>').join('') + '</div>';
  }
  if(rec.summary){
    html += '<p class="summary clip" id="sum">' + esc(rec.summary) + '</p>' +
      '<button class="readmore" id="moreSum">Read more</button>';
  }
  if(rec.note){
    html += '<div style="background:var(--card);border:1px solid var(--line);border-radius:13px;' +
      'padding:13px;margin-top:16px;display:flex;gap:11px">' + ic('note','sm') +
      '<div style="flex:1;font-size:13.5px;line-height:1.6;color:var(--muted)">' + esc(rec.note) + '</div></div>';
  }

  /* platform picker */
  html += '<label class="lbl" for="platSel">Where you watch it</label>' +
    '<select class="field" id="platSel" data-setplat="' + id + '">' +
      '<option value="">Not set</option>' +
      activePlatforms().map(pl => '<option value="' + esc(pl.id) + '"' +
        (pl.id === rec.platform ? ' selected' : '') + '>' + esc(pl.name) + '</option>').join('') +
    '</select>';

  const L = watchLink(id);
  if(L){
    html += '<button class="btn primary wide" data-watch="' + id + '" style="margin-top:10px">' +
      ic('play','sm') + 'Watch on ' + esc(L.platform ? L.platform.name : 'site') + '</button>' +
      '<p class="h-sub" style="margin-top:7px;font-size:12px">' +
      (L.exact ? 'Opens your saved link.'
               : 'Searches ' + esc(L.platform.name) + ' and copies the title. Some apps open an empty ' +
                 'search box — paste it, or save an exact link from the ⋮ menu.') +
      '</p>';
  }

  /* ---- seasons: tabs, so only one season's episodes are ever on screen ---- */
  const active = openSeasons[id] !== undefined && seasons[openSeasons[id]]
    ? openSeasons[id]
    : (p.next ? p.next[E_S] : keys[keys.length - 1]);

  html += '<div class="sect"><div class="sect-head"><h2 class="sect-title">Seasons</h2>' +
    (p.status !== 'done'
      ? '<button class="sect-more" data-complete="' + id + '">Mark whole series done</button>'
      : '') +
    '</div>';

  html += '<div class="stabs">' + keys.map(function(k){
    const eps = seasons[k];
    const done = eps.filter(x => w[x[E_ID]]).length;
    const full = done === eps.length;
    return '<button class="stab' + (k === active ? ' on' : '') + (full ? ' full' : '') + '" ' +
      'data-sopen="' + k + '" aria-pressed="' + (k === active) + '">' +
      '<b>' + (k === 0 ? 'Sp' : 'S' + k) + '</b>' +
      '<i>' + (full ? '✓' : done + '/' + eps.length) + '</i></button>';
  }).join('') + '</div>';

  const eps = seasons[active] || [];
  const sDone = eps.filter(x => w[x[E_ID]]).length;
  const sNext = eps.find(x => !w[x[E_ID]] && hasAired(x[E_DATE]));

  html += '<div class="spanel">' +
    '<div class="spanel-top">' +
      '<h3>' + (active === 0 ? 'Specials' : 'Season ' + active) + '</h3>' +
      '<span class="mono">' + sDone + '/' + eps.length + '</span>' +
    '</div>' +
    '<div class="sc-foot" style="margin:0 0 12px">' +
      '<div class="pbar' + (sDone === eps.length ? ' done' : '') + '">' +
        '<i style="width:' + (eps.length ? sDone/eps.length*100 : 0) + '%"></i></div>' +
      '<span class="pct">' + (eps.length ? Math.round(sDone/eps.length*100) : 0) + '%</span>' +
    '</div>' +
    '<div class="spanel-tools">' +
      '<button class="btn sm" data-sall="' + active + '">' +
        (sDone === eps.length ? 'Clear season' : 'Mark season watched') + '</button>' +
      '<button class="btn sm" data-ssel="' + active + '">' +
        (selSeason === active ? 'Cancel select' : 'Select…') + '</button>' +
    '</div>' +
  '</div>';

  /* the next unwatched episode of this season, lifted to the top */
  if(sNext && !rec.hold){
    html += '<div class="nextcard">' +
      '<div class="lbl" style="margin:0 0 8px">Next in this season</div>' +
      '<h4>' + epCode(sNext[E_S], sNext[E_N]) + ' · ' + esc(sNext[E_NAME] || 'Untitled') + '</h4>' +
      '<div class="meta">' + fmtDate(sNext[E_DATE]) + ' · ' + fmtRun(sNext[E_RUN]) + '</div>' +
      '<div class="row">' +
        '<button class="btn primary" data-mark="' + id + ':' + sNext[E_ID] + '">' +
          ic('check','sm') + 'Watched</button>' +
        '<button class="btn" data-tohere="' + sNext[E_ID] + '">' + ic('down','sm') + 'All up to here</button>' +
      '</div></div>';
  }

  html += '<div class="spanel" style="padding:6px 8px">' +
    eps.map(x => epRow(x, w, sNext && sNext[E_ID] === x[E_ID])).join('') + '</div>';

  html += '</div></div>';

  mainEl.innerHTML = html;

  const ms = document.getElementById('moreSum');
  if(ms) ms.onclick = function(){
    const sEl = document.getElementById('sum');
    sEl.classList.toggle('clip');
    ms.textContent = sEl.classList.contains('clip') ? 'Read more' : 'Show less';
  };
  window.scrollTo({top:0});
}
function kv(k,v){ return '<div><dt>' + esc(k) + '</dt><dd>' + esc(String(v)) + '</dd></div>'; }

function epRow(e, w, isNext){
  const on = !!w[e[E_ID]], aired = hasAired(e[E_DATE]);
  const picked_ = picked.has(e[E_ID]);
  return '<div class="eprow' + (on ? ' on' : '') + (picked_ ? ' picked' : '') +
      (isNext && !on ? ' next' : '') + '" ' +
      'data-ep="' + e[E_ID] + '" data-eps="' + e[E_S] + '" data-epn="' + (e[E_N]||0) + '">' +
    '<button class="epbox" data-toggle="' + e[E_ID] + '" aria-pressed="' + on + '" ' +
      'aria-label="' + (on ? 'Unmark ' : 'Mark ') + epCode(e[E_S],e[E_N]) + ' watched">' +
      '<svg viewBox="0 0 24 24"><path d="M4 12.5 9 17.5 20 6.5"/></svg></button>' +
    '<button class="eptext" data-toggle="' + e[E_ID] + '" tabindex="-1">' +
      '<b>' + epCode(e[E_S], e[E_N]) + '  ' + esc(e[E_NAME] || 'Untitled') + '</b>' +
      '<span>' + fmtDate(e[E_DATE]) + ' · ' + fmtRun(e[E_RUN]) +
        (aired ? '' : ' · not aired') + (isNext && !on ? ' · NEXT' : '') + '</span>' +
    '</button>' +
    (on || !aired ? '<span style="width:42px;flex:none"></span>'
      : '<button class="uphere" data-tohere="' + e[E_ID] + '" ' +
        'aria-label="Mark everything up to and including ' + epCode(e[E_S],e[E_N]) + ' watched" ' +
        'title="Mark everything up to here as watched">' + ic('down','sm') + '</button>') +
  '</div>';
}


/* ═══════════ viewing history analytics ═══════════ */
function allWatchStamps(){
  const out = [];
  Object.keys(db.watched).forEach(function(sid){
    const w = db.watched[sid];
    Object.keys(w).forEach(function(eid){ if(w[eid] > 1000000) out.push(w[eid]); });
  });
  return out.sort((a,b) => a - b);
}
function dayKey(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }

function streaks(){
  const days = {};
  allWatchStamps().forEach(function(ts){ days[dayKey(ts)] = true; });
  const keys = Object.keys(days).map(Number).sort((a,b) => a - b);
  if(!keys.length) return { current:0, longest:0, activeDays:0 };

  let longest = 1, run = 1;
  for(let i = 1; i < keys.length; i++){
    run = (keys[i] - keys[i-1] === DAY) ? run + 1 : 1;
    if(run > longest) longest = run;
  }
  /* a streak still counts if the last watch was today or yesterday */
  const today = dayKey(Date.now());
  let current = 0;
  if(days[today] || days[today - DAY]){
    let cursor = days[today] ? today : today - DAY;
    while(days[cursor]){ current++; cursor -= DAY; }
  }
  return { current, longest, activeDays: keys.length };
}

function weeklyBuckets(n){
  const stamps = allWatchStamps();
  const start = startOfWeek();
  const out = [];
  for(let i = n - 1; i >= 0; i--){
    const from = start - i * 7 * DAY, to = from + 7 * DAY;
    out.push({ from, count: stamps.filter(t => t >= from && t < to).length });
  }
  return out;
}
function busiestDay(){
  const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const tally = [0,0,0,0,0,0,0];
  allWatchStamps().forEach(function(ts){ tally[new Date(ts).getDay()]++; });
  const max = Math.max.apply(null, tally);
  if(!max) return null;
  return { name: names[tally.indexOf(max)], count: max };
}
function humanTime(mins){
  const days = mins / 1440;
  if(days >= 1) return days.toFixed(1) + ' full days';
  return Math.round(mins / 60) + ' hours';
}

/* ---------- STATS ---------- */
function viewStats(){
  const shows = allShows();
  if(!shows.length){
    mainEl.innerHTML = '<div class="view">' + emptyState('📊','No statistics yet',
      'Track a few episodes and this page will fill up.') + '</div>';
    return;
  }
  const all = shows.map(s => progress(s.id)).filter(Boolean);
  const by = st => all.filter(p => p.status === st).length;
  let eps=0, mins=0, remaining=0, week=0, month=0;
  const wk = startOfWeek(), mo = startOfMonth();
  const byPlat = {}, byGenre = {};

  all.forEach(function(p){
    eps += p.done; mins += p.mins; remaining += Math.max(0, p.aired - p.doneAired);
    const plat = platformOf(p.rec.id);
    if(plat) byPlat[plat.name] = (byPlat[plat.name] || 0) + p.done;
    (p.rec.genres || []).forEach(function(g){ byGenre[g] = (byGenre[g] || 0) + p.done; });
    const w = db.watched[p.rec.id] || {};
    Object.keys(w).forEach(function(k){
      if(w[k] >= wk) week++;
      if(w[k] >= mo) month++;
    });
  });
  const totalEps = all.reduce((s,p) => s + p.total, 0);
  const overall = totalEps ? Math.round(eps/totalEps*100) : 0;

  function bars(obj, unit){
    const arr = Object.keys(obj).map(k => [k, obj[k]]).sort((a,b) => b[1]-a[1]).slice(0,6);
    if(!arr.length) return '<p class="h-sub">Nothing recorded yet.</p>';
    const max = arr[0][1] || 1;
    return '<div class="bars">' + arr.map(function(r){
      return '<div class="barrow"><span class="lbl">' + esc(r[0]) + '</span>' +
        '<span class="track"><i style="width:' + (r[1]/max*100) + '%"></i></span>' +
        '<span class="val">' + r[1] + '</span></div>';
    }).join('') + '</div>';
  }

  const st = streaks();
  const weeks = weeklyBuckets(12);
  const peak = Math.max.apply(null, weeks.map(x => x.count).concat([1]));
  const lastWeek = weeks[weeks.length - 2] ? weeks[weeks.length - 2].count : 0;
  const thisWeek = weeks[weeks.length - 1].count;
  const delta = thisWeek - lastWeek;
  const bd = busiestDay();

  const sparkBars = weeks.map(function(wk){
    const h = Math.max(3, Math.round(wk.count / peak * 100));
    return '<div class="' + (wk.count ? 'hot' : '') + '" style="height:' + h + '%" ' +
      'title="' + wk.count + ' episodes"></div>';
  }).join('');

  const facts = [];
  if(st.current > 1) facts.push(['🔥', 'You have watched something ' + st.current + ' days running.']);
  if(mins > 1440) facts.push(['⏳', 'That is ' + humanTime(mins) + ' of your life. No regrets.']);
  if(bd) facts.push(['📅', bd.name + ' is your biggest viewing day — ' + bd.count + ' episodes logged.']);
  if(delta > 0 && lastWeek > 0) facts.push(['📈', 'You are ' + delta + ' episodes ahead of last week.']);
  else if(delta < 0 && thisWeek > 0) facts.push(['📉', Math.abs(delta) + ' fewer than last week. Slow week.']);
  if(remaining > 0) facts.push(['🎯', remaining + ' episodes stand between you and a clean slate.']);
  if(by('done') >= 3) facts.push(['🏆', 'You have finished ' + by('done') + ' series start to finish.']);

  mainEl.innerHTML = '<div class="view">' +
    '<p class="h-eyebrow">Your viewing</p><h1 class="h-title">Statistics.</h1>' +

    '<div class="sect" style="margin-top:22px">' +
      '<div class="streak"><span class="flame">' + (st.current > 0 ? '🔥' : '🌙') + '</span>' +
        '<div><b>' + st.current + (st.current === 1 ? ' day' : ' days') + '</b>' +
        '<span>' + (st.current > 0 ? 'Current streak · best ever ' + st.longest : 'No streak going — watch something tonight') +
        '</span></div></div>' +
      '<div class="statgrid">' +
        '<div class="statcard accent"><b>' + eps + '</b><span>Episodes watched</span></div>' +
        '<div class="statcard"><b>' + fmtRun(mins) + '</b><span>Total time</span></div>' +
        '<div class="statcard"><b>' + remaining + '</b><span>Episodes left</span></div>' +
        '<div class="statcard"><b>' + overall + '%</b><span>Overall complete</span></div>' +
      '</div></div>' +

    '<div class="sect"><div class="sect-head"><h2 class="sect-title">Last 12 weeks</h2></div>' +
      '<div class="statcard">' +
        '<div class="spark">' + sparkBars + '</div>' +
        '<div class="sparkx"><span>12 weeks ago</span><span>this week</span></div>' +
      '</div>' +
      '<div class="statgrid" style="margin-top:10px">' +
        '<div class="statcard"><b>' + thisWeek + '</b><span>This week</span></div>' +
        '<div class="statcard"><b>' + month + '</b><span>This month</span></div>' +
        '<div class="statcard"><b>' + st.activeDays + '</b><span>Days watched ever</span></div>' +
        '<div class="statcard"><b>' + st.longest + '</b><span>Longest streak</span></div>' +
      '</div></div>' +

    (facts.length ? '<div class="sect"><div class="sect-head"><h2 class="sect-title">Fun facts</h2></div>' +
      facts.map(f => '<div class="funfact"><span class="em">' + f[0] + '</span><span>' + esc(f[1]) + '</span></div>').join('') +
      '</div>' : '') +

      bars(byPlat) + '</div>' +

/* ═══════════════════════════════════════════════════════════
   DISCOVER — genre-affinity recommendations

   TVmaze has no "similar shows" endpoint, so this builds a local
   corpus from its show index (a few pages, cached for 30 days)
   and scores each candidate on genre overlap with what you have
   actually watched, weighted by episodes watched, nudged by rating.
   It is taste-by-genre, not collaborative filtering — good at
   "you liked a sitcom, here are the best other sitcoms".
   ═══════════════════════════════════════════════════════════ */
const CORPUS_KEY = 'spine-corpus-v1';
const CORPUS_PAGES = 4;          /* 250 shows per page */
const CORPUS_TTL = 30 * DAY;
let corpus = null, corpusLoading = false, corpusError = '';

function readCorpus(){
  try {
    const raw = JSON.parse(localStorage.getItem(CORPUS_KEY));
    if(raw && raw.at && (Date.now() - raw.at) < CORPUS_TTL && raw.shows && raw.shows.length) return raw.shows;
  } catch(e){}
  return null;
}

async function loadCorpus(){
  const cached = readCorpus();
  if(cached){ corpus = cached; return corpus; }
  corpusLoading = true; corpusError = '';
  if(route.name === 'discover') viewDiscover();
  try {
    const pages = [];
    for(let i = 0; i < CORPUS_PAGES; i++) pages.push(api('/shows?page=' + i, 15000));
    const results = await Promise.all(pages);
    const slim = [];
    results.forEach(function(list){
      (list || []).forEach(function(s){
        if(!s.genres || !s.genres.length) return;           /* ungenred rows can't be scored */
        if(!s.rating || !s.rating.average) return;          /* nor unrated ones */
        slim.push({
          id: s.id, name: s.name,
          image: s.image ? s.image.medium : null,
          genres: s.genres,
          rating: s.rating.average,
          premiered: s.premiered || '',
          status: s.status || '',
          summary: strip(s.summary || '').slice(0, 180)
        });
      });
    });
    corpus = slim;
    try { localStorage.setItem(CORPUS_KEY, JSON.stringify({ at: Date.now(), shows: slim })); }
    catch(e){ console.warn('corpus too large to cache', e); }
  } catch(e){
    corpusError = apiMessage(e);
  }
  corpusLoading = false;
  if(route.name === 'discover') viewDiscover();
  return corpus;
}

/* how much you like each genre, weighted by episodes actually watched */
function genreProfile(){
  const prof = {}; let any = false;
  allShows().forEach(function(rec){
    const pr = progress(rec.id);
    if(!pr) return;
    const weight = pr.done > 0 ? pr.done : (rec.favourite || rec.saved ? 1 : 0);
    if(weight <= 0) return;
    (rec.genres || []).forEach(function(g){
      prof[g] = (prof[g] || 0) + weight;
      any = true;
    });
  });
  if(!any) return null;
  const max = Math.max.apply(null, Object.keys(prof).map(k => prof[k]));
  Object.keys(prof).forEach(k => prof[k] = prof[k] / max);   /* 0..1 */
  return prof;
}

function recommendations(limit){
  if(!corpus) return [];
  const prof = genreProfile();
  if(!prof) return [];
  const seen = {};
  allShows().forEach(s => seen[s.id] = true);
  const topGenres = Object.keys(prof).sort((a,b) => prof[b] - prof[a]);

  const scored = corpus.filter(c => !seen[c.id]).map(function(c){
    let overlap = 0, matched = [];
    c.genres.forEach(function(g){
      if(prof[g]){ overlap += prof[g]; matched.push(g); }
    });
    if(!overlap) return null;
    /* average the affinity so a 5-genre show isn't automatically ahead of a focused one */
    const affinity = overlap / Math.sqrt(c.genres.length);
    const score = affinity * (0.55 + (c.rating / 10) * 0.45);
    return { show: c, score: score, matched: matched };
  }).filter(Boolean);

  scored.sort((a,b) => b.score - a.score);

  /* which of your shows most explains this pick */
  return scored.slice(0, limit || 24).map(function(r){
    let best = null, bestOverlap = 0;
    allShows().forEach(function(rec){
      const pr = progress(rec.id);
      if(!pr || pr.done === 0) return;
      const shared = (rec.genres || []).filter(g => r.matched.indexOf(g) > -1).length;
      if(shared > bestOverlap){ bestOverlap = shared; best = rec; }
    });
    r.because = best;
    return r;
  });
}

function viewDiscover(){
  const prof = genreProfile();

  if(!prof){
    mainEl.innerHTML = '<div class="view"><p class="h-eyebrow">Discover</p>' +
      '<h1 class="h-title">Find your next show.</h1>' +
      emptyState('🎭', 'Watch something first',
        'Mark a few episodes and this page will suggest shows that match the genres you actually watch.',
        { id:'ctaAdd3', label:'Add a series' }) + '</div>';
    const b = document.getElementById('ctaAdd3'); if(b) b.onclick = openAddSheet;
    return;
  }

  const topGenres = Object.keys(prof).sort((a,b) => prof[b] - prof[a]).slice(0,5);
  let html = '<div class="view"><p class="h-eyebrow">Discover</p>' +
    '<h1 class="h-title">Because you watch ' + esc(topGenres[0].toLowerCase()) + '.</h1>' +
    '<p class="h-sub">Matched on the genres you spend the most episodes in.</p>' +
    '<div class="chiprow" style="margin-top:16px">' +
      topGenres.map(g => '<span class="chip">' + esc(g) +
        '<span class="n">' + Math.round(prof[g] * 100) + '</span></span>').join('') +
    '</div>';

  if(corpusLoading){
    html += '<p class="hint">Building your recommendation pool…</p>' + skeletonCards(4) + '</div>';
    mainEl.innerHTML = html;
    return;
  }
  if(!corpus){
    html += (corpusError
      ? '<p class="error">' + esc(corpusError) + '</p>'
      : '<p class="h-sub">Fetch a pool of shows to match against — about 1000 titles, cached for a month.</p>') +
      '<button class="btn primary wide" id="btnLoadCorpus" style="margin-top:14px">' +
      (corpusError ? 'Try again' : 'Load recommendations') + '</button></div>';
    mainEl.innerHTML = html;
    document.getElementById('btnLoadCorpus').onclick = loadCorpus;
    return;
  }

  const recs = recommendations(24);
  if(!recs.length){
    html += emptyState('🤷', 'Nothing new to suggest',
      'Everything matching your genres is already in your library. Try adding a show from a new genre.') + '</div>';
    mainEl.innerHTML = html;
    return;
  }

  html += '<div class="sect">' + recs.map(function(r){
    const c = r.show;
    return '<div class="recwrap">' +
      (c.image
        ? '<img class="recposter" src="' + esc(c.image) + '" alt="" loading="lazy">'
        : '<div class="recposter ph">' + esc(c.name.charAt(0)) + '</div>') +
      '<div class="recbody">' +
        '<h4>' + esc(c.name) + '</h4>' +
        '<div class="mono">' + (c.premiered ? c.premiered.slice(0,4) : '—') +
          ' · ★ ' + c.rating + ' · ' + esc(c.genres.slice(0,2).join(', ')) + '</div>' +
        (r.because ? '<div class="recwhy">Because you watch ' + esc(r.because.name) + '</div>' : '') +
        (c.summary ? '<div class="recsum">' + esc(c.summary) + '…</div>' : '') +
        '<button class="btn sm" data-add="' + c.id + '" style="align-self:flex-start;margin-top:2px">' +
          'Add to library</button>' +
      '</div></div>';
  }).join('') + '</div>';

  html += '<button class="btn wide" id="btnRefreshCorpus" style="margin-top:8px">Refresh the pool</button></div>';
  mainEl.innerHTML = html;
  document.getElementById('btnRefreshCorpus').onclick = function(){
    localStorage.removeItem(CORPUS_KEY); corpus = null; loadCorpus();
  };
}

/* deleting a platform that is in use asks what to do with those series (§33) */
function deletePlatform(pid){
  const p = db.platforms.find(x => x.id === pid);
  if(!p) return;
  const users = allShows().filter(s => s.platform === pid);
  if(!users.length){
    if(!confirm('Delete "' + p.name + '"?')) return;
    db.platforms = db.platforms.filter(x => x.id !== pid);
    save(); viewSettings(); toast('"' + p.name + '" deleted');
    return;
  }
  const opts = activePlatforms().filter(x => x.id !== pid);
  openSheet('Delete "' + p.name + '"?',
    '<p class="h-sub" style="margin:0 0 4px">' + users.length + ' series ' +
      (users.length === 1 ? 'is' : 'are') + ' assigned to this platform. What should happen to ' +
      (users.length === 1 ? 'it' : 'them') + '?</p>' +
    '<label class="lbl">Reassign to</label>' +
    '<select class="field" id="reassign"><option value="">— leave them untagged —</option>' +
      opts.map(o => '<option value="' + esc(o.id) + '">' + esc(o.name) + '</option>').join('') +
    '</select>' +
    '<button class="btn danger wide" id="doDel" style="margin-top:16px">Delete platform</button>' +
    '<button class="btn wide" id="noDel" style="margin-top:9px">Cancel</button>',
    function(){
      document.getElementById('noDel').onclick = closeSheet;
      document.getElementById('doDel').onclick = function(){
        const to = document.getElementById('reassign').value;
        users.forEach(function(s){ if(to) s.platform = to; else delete s.platform; });
        db.platforms = db.platforms.filter(x => x.id !== pid);
        save(); closeSheet(); viewSettings();
        toast(to ? users.length + ' series moved' : users.length + ' series left untagged');
      };
    });
}

/* ---------- export / import ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'spine-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Backup downloaded');
}
function importData(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const fr = new FileReader();
  fr.onload = function(){
    let data;
    try { data = JSON.parse(fr.result); }
    catch(err){ toast("That file isn't valid JSON"); return; }
    if(!data || !data.shows){ toast("That doesn't look like a SPINE backup"); return; }
    const incoming = Object.keys(data.shows).length;
    if(!confirm('Merge ' + incoming + ' series from this backup into your library?\n\n' +
                'Existing series keep whichever watch history is larger.')) return;
    /* merge, never clobber */
    Object.keys(data.shows).forEach(function(id){
      if(!db.shows[id]) db.shows[id] = data.shows[id];
    });
    Object.keys(data.watched || {}).forEach(function(sid){
      const mine = db.watched[sid] || {};
      const theirs = data.watched[sid] || {};
      db.watched[sid] = Object.assign({}, theirs, mine);
    });
    (data.platforms || []).forEach(function(p){
      if(!db.platforms.some(x => x.id === p.id)) db.platforms.push(p);
    });
    save(); viewSettings(); toast('Backup merged — ' + incoming + ' series processed');
  };
  fr.readAsText(file);
  e.target.value = '';
}

   ACTIONS ON PROGRESS
   ═══════════════════════════════════════════════════════════ */
let picked = new Set(), selSeason = null;

function checkCompletion(id, before){
  const p = progress(id);
  if(p.status === 'done' && before !== 'done'){
    db.shows[id].completedAt = Date.now();
    save();
    toast('🎉 ' + db.shows[id].name + ' complete!');
    return true;
  }
  if(p.status !== 'done' && db.shows[id].completedAt){
    db.shows[id].completedAt = null; save();
  }
  return false;
}

function markEpisode(showId, epId, on, silent){
  const rec = db.shows[showId];
  if(!rec) return;
  const before = progress(showId).status;
  const w = watchedOf(showId);
  const had = w[epId];
  if(on) w[epId] = Date.now(); else delete w[epId];
  rec.touched = Date.now();
  if(rec.hold && on){ rec.hold = null; }
  save();
  rerender();
  const celebrated = checkCompletion(showId, before);
  if(silent || celebrated) return;
  const ep = (rec.eps||[]).find(e => String(e[E_ID]) === String(epId));
  const code = ep ? epCode(ep[E_S], ep[E_N]) : 'Episode';
  toast(code + (on ? ' marked watched' : ' marked unwatched'), function(){
    if(on){ if(had) w[epId] = had; else delete w[epId]; }
    else { w[epId] = had || Date.now(); }
    save(); rerender();
  });
}

function markMany(showId, epIds, on, label){
  const rec = db.shows[showId];
  const before = progress(showId).status;
  const w = watchedOf(showId);
  const snapshot = Object.assign({}, w);
  epIds.forEach(function(eid){ if(on) w[eid] = Date.now(); else delete w[eid]; });
  rec.touched = Date.now();
  if(rec.hold && on) rec.hold = null;
  save(); rerender();
  const celebrated = checkCompletion(showId, before);
  if(celebrated) return;
  toast(label || (epIds.length + ' episodes updated'), function(){
    db.watched[showId] = snapshot;
    save(); rerender();
  });
}

function stepProgress(id, dir){
  const p = progress(id);
  if(dir > 0 && p.next) markEpisode(id, p.next[E_ID], true);
  else if(dir < 0 && p.last) markEpisode(id, p.last[E_ID], false);
}

const NAV = [
  { id:'home',     label:'Home',     icon:'home'  },
  { id:'library',  label:'Series',   icon:'grid'  },
  { id:'upnext',   label:'Up next',  icon:'play'  },
  { id:'discover', label:'Discover', icon:'star'  },
  { id:'stats',    label:'Stats',    icon:'stats' }
];
function paintNav(){
  const nav = document.getElementById('nav');
  const brand = nav.querySelector('.navbrand');
  nav.innerHTML = '';
  if(brand) nav.appendChild(brand);
  NAV.forEach(function(n){
    const b = document.createElement('button');
    b.className = route.name === n.id ? 'on' : '';
    b.dataset.go = n.id;
    b.setAttribute('aria-current', route.name === n.id ? 'page' : 'false');
    b.innerHTML = ic(n.icon) + '<span>' + n.label + '</span>';
    nav.appendChild(b);
  });
}
function go(name, arg){
  if(sheetOpen) closeSheet();
  route = { name: name, arg: arg };
  if(NAV.some(n => n.id === name)) db.prefs.lastTab = name;
  picked.clear(); selSeason = null;
  const stray = document.getElementById('bulkbar');
  if(stray) stray.remove();   /* a selection made on the previous page must never linger over the next one */
  paintNav(); rerender();
  if(name !== 'show') window.scrollTo({ top:0 });
}
function rerender(){
  switch(route.name){
    case 'home':     viewHome(); break;
    case 'library':  viewLibrary(); break;
    case 'upnext':   viewUpNext(); break;
    case 'stats':    viewStats(); break;
    case 'discover': viewDiscover(); break;
    case 'settings': viewSettings(); break;
    case 'show':     viewShow(route.arg); break;
    default:         viewHome();
  }
}

    '[data-back],[data-step],[data-hold],[data-resume],[data-complete],[data-rewatch],[data-del],' +
    '[data-refresh],[data-note],[data-platsheet],[data-pset],[data-add],[data-fstatus],[data-settheme],[data-watch],[data-setlink],' +
    '[data-pmove],[data-ptoggle],[data-pdel],[data-bulk],[data-close]');

  /* episode multi-select swallows row taps first */
  if(selSeason !== null){
    const row = e.target.closest('.eprow[data-ep]');
    if(row && Number(row.dataset.eps) === selSeason && (!t || t.dataset.toggle)){
      const id = Number(row.dataset.ep);
      if(picked.has(id)) picked.delete(id); else picked.add(id);
      row.classList.toggle('picked', picked.has(id));
      paintBulkBar();
      return;
    }
  }
  if(!t || t === document.documentElement || t === document.body) return;
  const d = t.dataset;

  if(d.go)    { closeSheet(); return go(d.go); }
  if(d.back)  { return go(db.prefs.lastTab || 'home'); }
  if(d.open)  { closeSheet(); return go('show', d.open); }
  if(d.add)   { return addSeries(d.add); }

  if(d.fav){
    const r = db.shows[d.fav]; r.favourite = !r.favourite; r.touched = Date.now(); save();
    if(d.close) closeSheet();
    rerender(); toast(r.favourite ? 'Added to favourites' : 'Removed from favourites');
    return;
  }
  if(d.pin){
    const r = db.shows[d.pin]; r.pinned = !r.pinned; save();
    if(d.close) closeSheet(); rerender();
    toast(r.pinned ? 'Pinned to top' : 'Unpinned'); return;
  }
  if(d.prio){
    const r = db.shows[d.prio]; r.priority = ((r.priority || 0) + 1) % 3; save();
    openMenu(d.prio); rerender();
    return;
  }
  if(d.note)      { return openNoteSheet(d.note); }
  if(d.setlink)   { closeSheet(); return openLinkSheet(d.setlink); }
  if(d.watch){
    if(d.close) closeSheet();
    openWatch(d.watch);
    return;
  }
  if(d.platsheet) { return openPlatformSheet(d.platsheet); }
  if(d.pset){
    const parts = d.pset.split(':');
    const r = db.shows[parts[0]];
    if(parts[1]) r.platform = parts[1]; else delete r.platform;
    r.touched = Date.now(); save(); closeSheet(); rerender();
    const p = platformOf(parts[0]);
    toast(p ? 'Now on ' + p.name : 'Platform cleared');
    return;
  }
  if(d.mark){
    const parts = d.mark.split(':');
    if(d.close) closeSheet();
    return markEpisode(parts[0], Number(parts[1]), true);
  }
  if(d.menu)    { return openMenu(d.menu); }
  if(d.hold)    { closeSheet(); return openHoldSheet(d.hold); }
  if(d.resume){
    const r = db.shows[d.resume]; const prev = r.hold;
    r.hold = null; r.touched = Date.now(); save();
    if(d.close) closeSheet();
    rerender();
    toast('Resumed ' + r.name, function(){ r.hold = prev; save(); rerender(); });
    return;
  }
  if(d.complete){
    const p = progress(d.complete);
    const ids = p.eps.filter(e => e[E_S] !== 0 && hasAired(e[E_DATE])).map(e => e[E_ID]);
    if(d.close) closeSheet();
    return markMany(d.complete, ids, true, 'Marked as completed');
  }
  if(d.rewatch){
    const r = db.shows[d.rewatch];
    if(!confirm('Clear all watch progress for "' + r.name + '" and start over?')) return;
    const snap = Object.assign({}, db.watched[d.rewatch] || {});
    db.watched[d.rewatch] = {}; r.completedAt = null; r.touched = Date.now();
    save(); if(d.close) closeSheet(); rerender();
    toast('Starting over', function(){ db.watched[d.rewatch] = snap; save(); rerender(); });
    return;
  }
  if(d.del){
    const r = db.shows[d.del];
    if(!confirm('Remove "' + r.name + '" and its watch history from your library?')) return;
    delete db.shows[d.del]; delete db.watched[d.del];
    save(); closeSheet(); go(db.prefs.lastTab || 'home');
    toast('"' + r.name + '" removed'); return;
  }
  if(d.refresh)  { if(d.close) closeSheet(); return refreshSeries(d.refresh); }

  /* ---- episode level ---- */
  if(d.toggle){
    const id = route.arg, epId = Number(d.toggle);
    return markEpisode(id, epId, !watchedOf(id)[epId]);
  }
  if(d.sopen){
    openSeasons[route.arg] = Number(d.sopen);
    picked.clear(); selSeason = null;
    const sb = document.getElementById('bulkbar'); if(sb) sb.remove();
    return viewShow(route.arg);
  }
  if(d.sall){
    const id = route.arg, k = Number(d.sall), w = watchedOf(id);
    const eps = (db.shows[id].eps||[]).filter(e => e[E_S] === k);
    const on = !eps.every(e => w[e[E_ID]]);
    return markMany(id, eps.map(e => e[E_ID]), on,
      on ? 'Season ' + k + ' marked watched' : 'Season ' + k + ' cleared');
  }
  if(d.supto || d.tohere){
    const id = route.arg, target = Number(d.supto || d.tohere);
    const eps = db.shows[id].eps || [];
    const me = eps.find(e => e[E_ID] === target);
    if(!me) return;
    const ids = eps.filter(function(e){
      if(e[E_S] === 0 && me[E_S] !== 0) return false;
      if(e[E_S] > me[E_S]) return false;
      return e[E_S] < me[E_S] || (e[E_N]||0) <= (me[E_N]||0);
    }).map(e => e[E_ID]);
    return markMany(id, ids, true, 'Marked ' + ids.length + ' episodes watched');
  }
  if(d.ssel){
    const k = Number(d.ssel);
    selSeason = (selSeason === k) ? null : k;
    picked.clear();
    viewShow(route.arg); paintBulkBar();
    return;
  }
  if(d.bulk){
    const id = route.arg;
    if(d.bulk !== 'cancel') markMany(id, [...picked], d.bulk === 'on',
      picked.size + ' episodes updated');
    selSeason = null; picked.clear();
    paintBulkBar(); if(d.bulk === 'cancel') viewShow(id);
    return;
  }
  if(d.step)   { return stepProgress(route.arg, Number(d.step)); }
  if(d.fstatus){ libFilter.status = d.fstatus; return viewLibrary(); }
  if(d.settheme){ db.prefs.theme = d.settheme; save(); applyTheme(); return viewSettings(); }

  /* ---- platform manager ---- */
  if(d.pmove){
    const parts = d.pmove.split(':'), dir = Number(parts[1]);
    const list = sortedPlatforms();
    const i = list.findIndex(p => p.id === parts[0]);
    const j = i + dir;
    if(j < 0 || j >= list.length) return;
    const a = list[i].order; list[i].order = list[j].order; list[j].order = a;
    save(); return viewSettings();
  }
  if(d.ptoggle){
    const p = db.platforms.find(x => x.id === d.ptoggle);
    p.active = p.active === false;
    save(); viewSettings();
    toast(p.name + (p.active ? ' enabled' : ' hidden from the picker'));
    return;
  }
  if(d.pdel) { return deletePlatform(d.pdel); }
  if(d.close){ return closeSheet(); }
});

/* bulk selection bar */
function paintBulkBar(){
  let bar = document.getElementById('bulkbar');
  if(selSeason === null || picked.size === 0){ if(bar) bar.remove(); return; }
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'bulkbar'; bar.className = 'toast on';
    document.body.appendChild(bar);
  }
  bar.innerHTML = '<span>' + picked.size + ' selected</span>' +
    '<button data-bulk="on">Watched</button>' +
    '<button data-bulk="off" style="color:var(--muted)">Clear</button>' +
    '<button data-bulk="cancel" style="color:var(--muted)">Cancel</button>';
}

/* change events: platform dropdown + inline platform edits */
document.addEventListener('change', function(e){
  const el = e.target;
  if(el.dataset.setplat){
    const r = db.shows[el.dataset.setplat];
    if(el.value) r.platform = el.value; else delete r.platform;
    r.touched = Date.now(); save(); rerender();
    const p = platformOf(el.dataset.setplat);
    toast(p ? 'Now on ' + p.name : 'Platform cleared');
  }
  if(el.dataset.pcolor){
    const p = db.platforms.find(x => x.id === el.dataset.pcolor);
    if(p){ p.color = el.value; save(); }
  }
});
document.addEventListener('input', function(e){
  const el = e.target;
  if(el.dataset.pname){
    const p = db.platforms.find(x => x.id === el.dataset.pname);
    if(p){ p.name = el.value; save(); }   /* series link by id, so renames just work */
  }
  if(el.dataset.psearch !== undefined){
    const p = db.platforms.find(x => x.id === el.dataset.psearch);
    if(p){ p.search = el.value.trim(); save(); }
  }
});

/* top-bar buttons */
document.getElementById('btnAdd').onclick = openAddSheet;
document.getElementById('btnSettings').onclick = function(){ go('settings'); };
document.getElementById('btnFind').onclick = function(){
  go('library');
  setTimeout(function(){
    const s = document.getElementById('libSearch');
    if(s){ s.focus(); if(s.scrollIntoView) s.scrollIntoView({block:'center'}); }
  }, 80);
};

/* keyboard: / focuses search, a opens add */
document.addEventListener('keydown', function(e){
  if(e.target.matches('input,textarea,select')) return;
  if(e.key === '/'){ e.preventDefault(); document.getElementById('btnFind').click(); }
  if(e.key === 'a'){ e.preventDefault(); openAddSheet(); }
});

/* ═══════════ start ═══════════ */
applyTheme();
libSort = db.prefs.sort || 'recent';
go(db.prefs.lastTab || 'home');
</script>
